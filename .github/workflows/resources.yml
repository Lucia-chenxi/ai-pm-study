name: Save public resource
on:
  issues:
    types: [opened]
concurrency:
  group: public-resources
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  save:
    if: github.event.issue.user.login == github.repository_owner && github.event.issue.title == '更新公开书架' && contains(github.event.issue.body, '<!-- AIPM_SOURCE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply resource change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/apply-resource-issue.mjs
      - name: Push change
        run: git push
      - name: Close request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "资料已写入公开书架。网页更新可能需要几分钟。"
